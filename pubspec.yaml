name: quest
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dotted_border: ^2.1.0
  animations: ^2.1.0
  google_fonts: ^6.3.2
  hugeicons: ^1.1.0
  crossword: ^1.3.2
  intl_phone_number_input: ^0.7.5
  pinput: ^6.0.2
  glassmorphism: ^3.0.0
  simple_animation_progress_bar: ^1.9.2
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^8.0.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  image_picker: ^1.2.2
  scrollable_positioned_list: ^0.3.8
  audioplayers: ^6.7.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_quill: ^11.5.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  audio_waveforms: ^2.0.2
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  flutter_paypal: ^0.2.1
  video_player: ^2.11.1
  chewie: ^1.13.1
  url_launcher: ^6.3.2
  timeago: ^3.7.1
  app_links: ^7.2.0
  flutter_native_splash: ^2.4.8
  in_app_purchase: ^3.3.0
  file_picker: ^11.0.2
  video_thumbnail: ^0.5.6
  cached_network_image: ^3.4.1
  syncfusion_flutter_pdfviewer: ^33.2.13
  flutter_markdown: ^0.7.7+1
  flutter_html: ^3.0.0
  dio: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
